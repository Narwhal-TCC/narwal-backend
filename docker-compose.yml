# Local dev stack: MinIO (S3 API), DynamoDB Local, API app.
# Ports: MinIO API 9000, console 9001; DynamoDB Local 8000; app 8080.

services:
  # Official minio/minio Docker Hub images are no longer published (source-only).
  # coollabsio/minio is a community build of the last MinIO releases.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      # coollabsio/minio ships `mc`, not curl
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3 mb s3://narwal 2>/dev/null || true
      "

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: narwal
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DDB_TABLE: narwal
      JWT_SECRET: dev-only-change-me
      PLATFORM_ADMIN_USERNAME: admin
      PLATFORM_ADMIN_PASSWORD: admin
      PLATFORM_ADMIN_ORG_ID: platform
      SEED_DEMO_USERNAME: demo
      SEED_DEMO_PASSWORD: demo
      SEED_DEMO_ORG_ID: demo
      DETECTOR_LOCAL_PATH: /app/data/models/retinanet_melhor.pt
      DETECTOR_S3_URI: s3://narwal/models/v1/retinanet_melhor.pt
      CLASSIFIER_LOCAL_PATH: /app/data/models/fusion_ghostnetv2_mobilenetv2_melhor.pt
      CLASSIFIER_S3_URI: s3://narwal/models/v1/fusion_ghostnetv2_mobilenetv2_melhor.pt
      INFERENCE_TIMEOUT_SECONDS: "60"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started

volumes:
  minio_data:
