# Local dev stack: MinIO (S3 API), DynamoDB Local, API app.
# Ports: MinIO API 9000, console 9001; DynamoDB Local 8000; app 8080.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/narwal &&
      exit 0
      "

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: narwal
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DDB_TABLE: narwal
      JWT_SECRET: dev-only-change-me
      PLATFORM_ADMIN_USERNAME: admin
      PLATFORM_ADMIN_PASSWORD: admin
      PLATFORM_ADMIN_ORG_ID: platform
      MODEL_S3_URI: s3://narwal/models/v1/model.keras
      INFERENCE_TIMEOUT_SECONDS: "60"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started

volumes:
  minio_data:
