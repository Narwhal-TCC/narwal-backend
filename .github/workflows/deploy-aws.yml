# AWS: org secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, APP_BUCKET_NAME, STATE_BUCKET_NAME.
# See docs/aws/github-org-secrets.md
name: Deploy backend (AWS)

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "infra/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "scripts/aws/create-app-bucket.sh"
      - "scripts/aws/deploy-api-via-ssh.sh"
      - "scripts/aws/ec2-api-bootstrap.sh"
      - "scripts/aws/ensure-nginx-edge.sh"
      - "scripts/aws/mount-data-volume.sh"
      - "scripts/aws/narwal-nginx.conf"
      - "infra/templates/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip Terraform; rebuild/push API image and SSH restart only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.9.8"

jobs:
  provisioning:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    outputs:
      ecr_repository: ${{ steps.export.outputs.ecr_repository }}
      ecr_repository_url: ${{ steps.export.outputs.ecr_repository_url }}
      ec2_instance_id: ${{ steps.export.outputs.ec2_instance_id }}
      app_public_url: ${{ steps.export.outputs.app_public_url }}
      api_public_ip: ${{ steps.export.outputs.api_public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure app S3 bucket exists
        env:
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BUCKET_NAME}" ]; then
            echo "Organization secret APP_BUCKET_NAME is required (globally unique app bucket)." >&2
            exit 1
          fi
          bash scripts/aws/create-app-bucket.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure Terraform backend
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET_NAME || secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${STATE_BUCKET}" ]; then
            echo "Organization secret STATE_BUCKET_NAME or APP_BUCKET_NAME is required for remote state." >&2
            exit 1
          fi
          cat > infra/backend.hcl <<EOF
          bucket = "${STATE_BUCKET}"
          key    = "terraform/narwal-app/state.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF

      - name: Terraform init and apply
        env:
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          terraform -chdir=infra init -backend-config=backend.hcl
          terraform -chdir=infra apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="app_bucket_name=${APP_BUCKET_NAME}"

      - name: Export Terraform outputs
        id: export
        run: |
          set -euo pipefail
          echo "ecr_repository=$(terraform -chdir=infra output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_id=$(terraform -chdir=infra output -raw api_instance_id)" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$(terraform -chdir=infra output -raw app_public_url)" >> "$GITHUB_OUTPUT"
          echo "api_public_ip=$(terraform -chdir=infra output -raw api_public_ip)" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: provisioning
    if: always() && !cancelled() && (needs.provisioning.result == 'success' || needs.provisioning.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform (redeploy only)
        if: needs.provisioning.result == 'skipped'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve Terraform outputs
        id: tf
        run: |
          set -euo pipefail
          if [ "${{ needs.provisioning.result }}" = "success" ]; then
            echo "ecr_repository=${{ needs.provisioning.outputs.ecr_repository }}" >> "$GITHUB_OUTPUT"
            echo "ecr_repository_url=${{ needs.provisioning.outputs.ecr_repository_url }}" >> "$GITHUB_OUTPUT"
            echo "ec2_instance_id=${{ needs.provisioning.outputs.ec2_instance_id }}" >> "$GITHUB_OUTPUT"
            echo "app_public_url=${{ needs.provisioning.outputs.app_public_url }}" >> "$GITHUB_OUTPUT"
            echo "api_public_ip=${{ needs.provisioning.outputs.api_public_ip }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATE_BUCKET="${{ secrets.STATE_BUCKET_NAME || secrets.APP_BUCKET_NAME }}"
          cat > infra/backend.hcl <<EOF
          bucket = "${STATE_BUCKET}"
          key    = "terraform/narwal-app/state.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF
          terraform -chdir=infra init -backend-config=backend.hcl
          echo "ecr_repository=$(terraform -chdir=infra output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_id=$(terraform -chdir=infra output -raw api_instance_id)" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$(terraform -chdir=infra output -raw app_public_url)" >> "$GITHUB_OUTPUT"
          echo "api_public_ip=$(terraform -chdir=infra output -raw api_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.tf.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Restart API on EC2 via SSH
        env:
          EC2_HOST: ${{ steps.tf.outputs.api_public_ip }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ECR_REPOSITORY_URL: ${{ steps.tf.outputs.ecr_repository_url }}
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_SSH_PRIVATE_KEY}" ]; then
            echo "Repository secret EC2_SSH_PRIVATE_KEY is required (private PEM matching infra ssh_key_name / narwhal-dev-keypair)." >&2
            exit 1
          fi
          bash scripts/aws/deploy-api-via-ssh.sh

      - name: Post-deploy app health check
        env:
          APP_PUBLIC_URL: ${{ steps.tf.outputs.app_public_url }}
        run: |
          set -euo pipefail
          URL="${APP_PUBLIC_URL%/}/api/health"
          for attempt in $(seq 1 12); do
            last_code=$(curl -sS -o /tmp/narwal-deploy-health.txt -w '%{http_code}' "${URL}" || echo "000")
            if [ "${last_code}" = "200" ]; then
              echo "Post-deploy health check passed (HTTP 200)."
              exit 0
            fi
            echo "Attempt ${attempt}/12: HTTP ${last_code}"
            sleep 15
          done
          cat /tmp/narwal-deploy-health.txt >&2 || true
          exit 1
