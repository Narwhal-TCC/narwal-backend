name: Deploy backend (AWS)

on:
  push:
    branches: [master, main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "${ECR_REPOSITORY}" ]; then
            echo "Repository variable ECR_REPOSITORY is required (Terraform output ecr_repository_name)."
            exit 1
          fi
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Restart API on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "Repository variable EC2_INSTANCE_ID is required (Terraform output api_instance_id)."
            exit 1
          fi
          if [ -z "${ECR_REPOSITORY_URL}" ]; then
            echo "Repository variable ECR_REPOSITORY_URL is required (Terraform output ecr_repository_url)."
            exit 1
          fi
          SSM_PARAMS=$(python3 -c "
          import json
          import os
          import textwrap

          region = os.environ['AWS_REGION']
          ecr_url = os.environ['ECR_REPOSITORY_URL']
          tag = os.environ['IMAGE_TAG']
          script = textwrap.dedent(
              '''
              set -euo pipefail
              AWS_REGION={region}
              ECR_REPOSITORY_URL={ecr}
              IMAGE_TAG={tag}
              CONTAINER_NAME=narwal-api
              NARWAL_ENV_FILE=/etc/narwal/env
              ECR_REGISTRY=\"${{ECR_REPOSITORY_URL%%/*}}\"
              aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"
              IMAGE=\"${{ECR_REPOSITORY_URL}}:${{IMAGE_TAG}}\"
              docker pull \"$IMAGE\"
              if docker ps -a --format '{{{{.Names}}}}' | grep -qx \"$CONTAINER_NAME\"; then
                docker stop \"$CONTAINER_NAME\" || true
                docker rm \"$CONTAINER_NAME\" || true
              fi
              ENV_ARGS=()
              if [ -f \"$NARWAL_ENV_FILE\" ]; then
                ENV_ARGS=(--env-file \"$NARWAL_ENV_FILE\")
              fi
              docker run -d --name \"$CONTAINER_NAME\" --restart unless-stopped -p 127.0.0.1:8080:8080 -v /data:/data \"${{ENV_ARGS[@]}}\" \"$IMAGE\"
              '''
          ).format(region=region, ecr=ecr_url, tag=tag)
          print(json.dumps({'commands': [script]}))
          ")
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Narwal API deploy ${IMAGE_TAG}" \
            --parameters "${SSM_PARAMS}" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: ${COMMAND_ID}"
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" --output text)
          if [ "${STATUS}" != "Success" ]; then
            echo "SSM deploy failed with status ${STATUS}" >&2
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "[StandardOutputContent, StandardErrorContent]" --output text >&2
            exit 1
          fi

      - name: Post-deploy app health check
        env:
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_PUBLIC_URL}" ]; then
            echo "Repository variable APP_PUBLIC_URL is required (http://<elastic-ip> from terraform output app_public_url)."
            exit 1
          fi
          URL="${APP_PUBLIC_URL%/}/api/health"
          echo "Checking ${URL} ..."
          last_code="000"
          for attempt in $(seq 1 12); do
            last_code=$(curl -sS -o /tmp/narwal-deploy-health.txt -w '%{http_code}' "${URL}" || echo "000")
            if [ "${last_code}" = "200" ]; then
              echo "Post-deploy health check passed (HTTP 200)."
              exit 0
            fi
            echo "Attempt ${attempt}/12: HTTP ${last_code}"
            sleep 15
          done
          echo "Post-deploy health check failed (last HTTP ${last_code})." >&2
          echo "If the UI loads but /api fails, the EC2 instance may be stopped or Docker may be down." >&2
          cat /tmp/narwal-deploy-health.txt >&2 || true
          exit 1
